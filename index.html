<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM | Maria Bonita Concept</title>
<style>
:root{--gold:#c9a227;--gold2:#9d7b12;--bg:#f7f5f1;--card:#fff;--text:#292522;--muted:#766e68;--line:#e6ded6;--danger:#a43d46}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}.wrap{max-width:1100px;margin:auto;padding:24px}
header{background:#1f1b19;color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{font:24px Georgia,serif}.logo small{display:block;font:9px Arial;letter-spacing:3px;color:#d9c99a;margin-top:4px}
.badge{font-size:12px;color:#e7d89f}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 8px 25px rgba(50,35,25,.06)}
h1,h2{font-family:Georgia,serif}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{font-size:12px;font-weight:bold;color:var(--muted);display:block;margin-bottom:6px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.full{grid-column:1/-1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:10px;padding:12px 17px;cursor:pointer;font-weight:bold}
.gold{background:var(--gold);color:#fff}.gold:hover{background:var(--gold2)}
.dark{background:#292522;color:#fff}.danger{background:#f7e3e3;color:var(--danger)}
.secondary{background:#eee9e4;color:#3c3530}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);font-size:14px}th{font-size:12px;color:var(--muted)}
.thumb{width:54px;height:54px;border-radius:8px;object-fit:cover;background:#eee;vertical-align:middle}
.empty{text-align:center;color:var(--muted);padding:25px}
@media(max-width:700px){
  body{overflow-wrap:anywhere}
  .wrap{width:100%;padding:14px}
  header{padding:18px 16px}
  .logo{font-size:22px}
  .badge{font-size:10px;margin-top:5px;letter-spacing:1px}
  .card{padding:18px 16px;border-radius:14px;margin-bottom:16px;min-width:0}
  h1{font-size:25px;margin:0 0 20px}h2{font-size:23px;margin:0 0 18px}
  .grid{grid-template-columns:minmax(0,1fr);gap:18px}
  .grid>div{min-width:0}.full{grid-column:auto}
  label{font-size:13px;line-height:1.5}
  input,select{font-size:16px;min-height:48px;max-width:100%;padding:13px 12px}
  input[type=file]{font-size:14px}
  .actions{gap:10px}.actions .btn{flex:1;min-height:48px;padding:13px 10px}
  table,tbody{display:block;width:100%}
  thead{display:none}
  tbody{display:grid;gap:14px}
  tr{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px 12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
  td{display:block;border:0;padding:0;white-space:normal;min-width:0;font-size:15px}
  td:nth-child(1){grid-column:1;grid-row:1 / span 3}
  .thumb{width:64px;height:76px;object-fit:cover}
  td:nth-child(2){grid-column:2;line-height:1.4}
  td:nth-child(3){grid-column:2;color:var(--muted);font-size:13px}
  td:nth-child(4){grid-column:2;font-weight:bold;color:var(--gold2);font-size:17px}
  td:nth-child(5){grid-column:1 / -1;display:flex;gap:10px;margin-top:6px}
  td:nth-child(5) .btn{flex:1;min-height:46px;padding:12px 8px}
  #imagePreview{max-width:100%}
}
</style>
</head>
<body>
<div id="app">
<header>
  <div><div class="logo">Maria Bonita Concept</div><div class="badge">PAINEL ADMINISTRATIVO</div></div>
</header>

<div class="wrap">
  <div class="card">
    <h1 id="formTitle">Adicionar produto</h1>
    <div class="grid">
      <div><label>Nome do produto</label><input id="name" placeholder="Ex.: Vestido Aurora"></div>
      <div><label>Categoria</label>
        <select id="category">
          <option>Calcinhas</option><option>Sutiã</option><option>Baby Doll</option><option>Camisola</option><option>Conjuntos</option><option>Moda Fitness</option>
        </select>
      </div>
      <div><label>Preço (R$)</label><input id="price" type="number" step="0.01" placeholder="189,90"></div>
      <div>
      <label>Fotos do produto (computador ou celular)</label>
      <input id="imageFiles" type="file" accept="image/*" multiple onchange="handleImageFiles(this)">
      <div id="imagePreview" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"></div>
      <input id="image" type="hidden">
      <div style="font-size:11px;color:var(--muted);margin-top:6px">Você pode selecionar várias fotos. A primeira será a foto principal.</div>
    </div>
      <div><label>Tamanhos (separe por vírgula)</label><input id="sizes" placeholder="P, M, G"></div>
      <div><label>Cores (separe por vírgula)</label><input id="colors" placeholder="Preto, Rosé"></div>
    </div>
    <div class="actions">
      <button class="btn gold" onclick="saveProduct()">Salvar produto</button>
      <button class="btn secondary" onclick="clearForm()">Limpar</button>
    </div>
    <div id="formMsg" style="margin-top:10px;color:var(--gold2);font-size:13px"></div>
  </div>

  <div class="card">
    <h2>Produtos cadastrados</h2>
    <div id="list"></div>
  </div>

  <div class="card">
    <h2>Configurações</h2>
    <label>WhatsApp da loja (somente números com DDI/DDD)</label>
    <input id="whatsapp" placeholder="5522999999999">
    <div class="actions"><button class="btn dark" onclick="saveSettings()">Salvar WhatsApp</button></div>
  </div>
</div>
</div>

<script>
const KEY='mariaBonitaProducts';
const SETTINGS='mariaBonitaSettings';
let editingId=null;
let selectedImages=[];

const defaults=[
{id:1,name:"Vestido Aurora",category:"Vestidos",price:189.90,image:"",sizes:["P","M","G"],colors:["Rosé","Preto"]},
{id:2,name:"Vestido Luna",category:"Vestidos",price:219.90,image:"",sizes:["P","M","G"],colors:["Off-white","Terracota"]},
{id:3,name:"Blusa Sofia",category:"Blusas",price:99.90,image:"",sizes:["P","M","G"],colors:["Branco","Rosé"]},
{id:4,name:"Blusa Amélia",category:"Blusas",price:119.90,image:"",sizes:["P","M","G","GG"],colors:["Preto","Bege"]},
{id:5,name:"Calça Maya",category:"Calças",price:159.90,image:"",sizes:["36","38","40","42"],colors:["Jeans","Preto"]},
{id:6,name:"Calça Elegance",category:"Calças",price:179.90,image:"",sizes:["36","38","40","42"],colors:["Areia","Preto"]},
{id:7,name:"Conjunto Bella",category:"Conjuntos",price:249.90,image:"",sizes:["P","M","G"],colors:["Bege","Rosé"]},
{id:8,name:"Conjunto Chiara",category:"Conjuntos",price:269.90,image:"",sizes:["P","M","G"],colors:["Preto","Verde oliva"]},
{id:9,name:"Bolsa Paris",category:"Acessórios",price:139.90,image:"",sizes:["Único"],colors:["Caramelo","Preto"]},
{id:10,name:"Cinto Milano",category:"Acessórios",price:69.90,image:"",sizes:["Único"],colors:["Marrom","Preto"]}
];


function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const max=1400;
        let w=img.width,h=img.height;
        if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r)}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',.82));
      };
      img.onerror=reject; img.src=e.target.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}
async function loadImagesFromDevice(files){
  selectedImages=[];
  for(const file of [...files]){
    if(file.type.startsWith('image/')) selectedImages.push(await compressImage(file));
  }
  document.getElementById('image').value=selectedImages[0]||'';
  renderImagePreview();
}
function renderImagePreview(){
  const box=document.getElementById('imagePreview'); if(!box)return;
  box.innerHTML=selectedImages.map((src,i)=>`<div style="position:relative">
    <img src="${src}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:2px solid ${i===0?'var(--gold)':'var(--line)'}">
    <button type="button" onclick="removeImage(${i})" style="position:absolute;right:-6px;top:-6px;border:0;background:var(--danger);color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer">×</button>
  </div>`).join('');
}
function removeImage(i){
  selectedImages.splice(i,1);
  document.getElementById('image').value=selectedImages[0]||'';
  renderImagePreview();
}

function getProducts(){
  let p=localStorage.getItem(KEY);
  if(!p){localStorage.setItem(KEY,JSON.stringify(defaults));return defaults}
  try{return JSON.parse(p)}catch(e){return defaults}
}
function setProducts(p){localStorage.setItem(KEY,JSON.stringify(p))}
function showApp(){
  let settings={};
  try{settings=JSON.parse(localStorage.getItem(SETTINGS)||'{}')||{}}catch(e){}
  document.getElementById('whatsapp').value=settings.whatsapp||'';
  render();
}
async function handleImageFiles(input){
  const files=[...input.files].filter(f=>f.type.startsWith('image/'));
  if(!files.length)return;
  selectedImages=[];
  for(const file of files){
    try{ selectedImages.push(await compressImage(file)); }catch(e){ console.error(e); }
  }
  document.getElementById('image').value=selectedImages[0]||'';
  renderImagePreview();
}
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const max=1200;
        let w=img.width,h=img.height;
        if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r)}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',.82));
      };
      img.onerror=reject; img.src=e.target.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}
function renderImagePreview(){
  const box=document.getElementById('imagePreview');
  const imgs=selectedImages.length?selectedImages:(document.getElementById('image').value?[document.getElementById('image').value]:[]);
  box.innerHTML=imgs.map((src,i)=>`<div style="position:relative"><img src="${src}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:2px solid ${i===0?'var(--gold)':'var(--line)'}"><button type="button" onclick="removeImage(${i})" style="position:absolute;right:-5px;top:-5px;border:0;background:#a43d46;color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer">×</button></div>`).join('');
}
function removeImage(i){
  selectedImages.splice(i,1);
  document.getElementById('image').value=selectedImages[0]||'';
  renderImagePreview();
}
function clearForm(){
  editingId=null; selectedImages=[]; document.getElementById('imageFiles').value='';
  document.getElementById('formTitle').textContent='Adicionar produto';
  ['name','price','image','sizes','colors'].forEach(id=>document.getElementById(id).value='');
  selectedImages=[];
  document.getElementById('imageFiles').value='';
  renderImagePreview();
  document.getElementById('formMsg').textContent='';
}
function saveProduct(){
  const name=document.getElementById('name').value.trim();
  const category=document.getElementById('category').value;
  const price=parseFloat(document.getElementById('price').value);
  const image=selectedImages[0] || document.getElementById('image').value.trim();
  const images=selectedImages.length ? [...selectedImages] : (image ? [image] : []);
  const sizes=document.getElementById('sizes').value.split(',').map(x=>x.trim()).filter(Boolean);
  const colors=document.getElementById('colors').value.split(',').map(x=>x.trim()).filter(Boolean);
  if(!name || isNaN(price) || !sizes.length || !colors.length){
    document.getElementById('formMsg').textContent='Preencha nome, preço, tamanhos e cores.';
    return;
  }
  let p=getProducts();
  if(editingId){
    p=p.map(x=>x.id===editingId?{...x,name,category,price,image,images,sizes,colors}:x);
    document.getElementById('formMsg').textContent='Produto atualizado!';
  }else{
    const id=p.length?p.reduce((m,x)=>Math.max(m,x.id),0)+1:1;
    p.push({id,name,category,price,image,images,sizes,colors});
    document.getElementById('formMsg').textContent='Produto adicionado!';
  }
  setProducts(p); clearForm(); render();
}
function editProduct(id){
  const p=getProducts().find(x=>x.id===id); if(!p)return;
  editingId=id;
  document.getElementById('formTitle').textContent='Editar produto';
  document.getElementById('name').value=p.name;
  document.getElementById('category').value=p.category;
  document.getElementById('price').value=p.price;
  selectedImages=[...(p.images||((p.image)?[p.image]:[]))];
  document.getElementById('image').value=selectedImages[0]||'';
  document.getElementById('imageFiles').value='';
  renderImagePreview();
  document.getElementById('sizes').value=p.sizes.join(', ');
  document.getElementById('colors').value=p.colors.join(', ');
  window.scrollTo({top:0,behavior:'smooth'});
}
function deleteProduct(id){
  if(!confirm('Excluir este produto?'))return;
  setProducts(getProducts().filter(x=>x.id!==id));render();
}
function render(){
  const p=getProducts();
  document.getElementById('list').innerHTML=p.length?`<table><thead><tr><th>Imagem</th><th>Produto</th><th>Categoria</th><th>Preço</th><th>Ações</th></tr></thead><tbody>${
    p.map(x=>`<tr><td>${(x.images&&x.images[0]||x.image)?`<img class="thumb" src="${x.images&&x.images[0]||x.image}" onerror="this.style.display='none'">`:'—'}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.category)}</td><td>R$ ${x.price.toFixed(2).replace('.',',')}</td><td><button class="btn gold" onclick="editProduct(${x.id})">Editar</button> <button class="btn danger" onclick="deleteProduct(${x.id})">Excluir</button></td></tr>`).join('')
  }</tbody></table>`:'<div class="empty">Nenhum produto cadastrado.</div>';
}
function saveSettings(){
  const whatsapp=document.getElementById('whatsapp').value.replace(/\D/g,'');
  localStorage.setItem(SETTINGS,JSON.stringify({whatsapp}));
  alert('WhatsApp salvo.');
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
document.addEventListener('DOMContentLoaded',showApp);
</script>
</body>
</html>
